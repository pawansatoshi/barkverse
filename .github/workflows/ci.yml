name: BARKVERSE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -e
          find api lib app -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate required static files
        run: |
          test -f app/index.html
          test -f app/styles.css
          test -f app/app.js
          test -f vercel.json
